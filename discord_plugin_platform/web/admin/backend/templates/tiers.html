{% extends "base.html" %}
{% block title %}資源方案{% endblock %}
{% block content %}
<h1>資源方案</h1>
<div id="error-box" class="error hidden"></div>
<table>
  <thead>
    <tr>
      <th>tier_name</th>
      <th>display_order</th>
      <th>description</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tiers-table-body"></tbody>
</table>

<h2>新增方案</h2>
<label>tier_name<input type="text" id="new-tier-name"></label>
<label>display_order<input type="number" id="new-tier-order" value="0"></label>
<label>description<input type="text" id="new-tier-description"></label>
<button id="create-tier-button">建立</button>
{% endblock %}
{% block scripts %}
<script>
async function loadTiers() {
  clearError("error-box");
  try {
    const tiers = await apiGet("/api/tiers");
    const body = document.getElementById("tiers-table-body");
    body.innerHTML = "";
    for (const tier of tiers) {
      const deleteButton = el("button", { text: "刪除", onclick: async () => {
        clearError("error-box");
        try {
          await apiDelete("/api/tiers/" + encodeURIComponent(tier.tier_name));
          await loadTiers();
        } catch (error) {
          showError("error-box", error);
        }
      }});
      body.appendChild(el("tr", {}, [
        el("td", { text: tier.tier_name }),
        el("td", { text: String(tier.display_order) }),
        el("td", { text: tier.description }),
        el("td", {}, [deleteButton]),
      ]));
    }
  } catch (error) {
    showError("error-box", error);
  }
}

document.getElementById("create-tier-button").addEventListener("click", async () => {
  clearError("error-box");
  try {
    await apiPost("/api/tiers", {
      tier_name: document.getElementById("new-tier-name").value,
      display_order: Number(document.getElementById("new-tier-order").value),
      description: document.getElementById("new-tier-description").value,
    });
    await loadTiers();
  } catch (error) {
    showError("error-box", error);
  }
});

loadTiers();
</script>
{% endblock %}
